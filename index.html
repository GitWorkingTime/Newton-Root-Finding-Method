<!DOCTYPE html>
<html>
    <head>
        <title>Newton's Method</title>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="controls">
            <div class="control expr-control">
                <label for="expr">Expression f(x)</label>
                <input type="text" id="expr" value="cos(x) + sin(x)" />
            </div>
            <div class="control">
                <label for="minX">Min X</label>
                <input type="number" id="minX" value="-3.14159" step="0.1" />
            </div>
            <div class="control">
                <label for="maxX">Max X</label>
                <input type="number" id="maxX" value="3.14159" step="0.1" />
            </div>
            <div class="control">
                <label for="minY">Min Y</label>
                <input type="number" id="minY" value="-3" step="0.1" />
            </div>
            <div class="control">
                <label for="maxY">Max Y</label>
                <input type="number" id="maxY" value="5" step="0.1" />
            </div>
            <div class="control">
                <label for="step">Step</label>
                <input type="number" id="step" value="0.1" step="0.01" min="0.001" />
            </div>
            <div class="control">
                <label for="startX">Starting X</label>
                <input type="number" id="startX" value="1" step="0.1" />
            </div>
            <div class="control">
                <label for="iterations">Iterations</label>
                <input type="number" id="iterations" value="3" step="1" min="1" />
            </div>
        </div>

        <button id="plot-btn">Plot</button>

        <div id="error"></div>

        <div class="chart-wrapper">
            <canvas id="canvas"></canvas>
        </div>

        <script type="module" src="/src/compile.ts"></script>
    </body>
</html>
